<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX</title>
<link rel="icon" type="image/png" sizes="16x16" href="./assets/paper.png">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/paper-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* =====================================================
   1. RESET + BASE
   ===================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit}

/* =====================================================
   2. DESIGN TOKENS — DEFAULTS (overridden by themes)
   ===================================================== */
:root{
  /* Layout */
  --sidebar-width-desktop:20%;
  --sidebar-width-collapsed:5rem;
  --top-bar-height:5rem;
  --content-padding-x:2rem;
  --content-padding-y:1.15rem;
  --menu-bar-control-gap:0.75rem;
  --project-grid-gap:1rem;
  --project-card-width-desktop:21.75rem;
  --project-card-height-desktop:25.35rem;

  /* Component sizes */
  --control-height:40px;
  --icon-button-size:40px;
  --avatar-size:2.65rem;

  /* Radius */
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-pill:999px;

  /* Fonts */
  --font-ui:'Rajdhani',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;

  /* Default accent (overridden by JS) */
  --accent:#ff8a00;
  --accent-2:#e07700;
  --accent-3:#cc6a00;
  --accent-rgb:255,138,0;
  --accent-glow:rgba(255,138,0,0.30);
  --accent-ring:rgba(255,138,0,0.45);
  --progress:var(--accent);
  --focus-ring:0 0 0 3px var(--accent-ring);
}

/* =====================================================
   3. FONT FAMILIES (data-font on body)
   ===================================================== */
body[data-font="rajdhani"]{
  --font-ui:'Rajdhani',ui-sans-serif,system-ui,sans-serif;
}
body[data-font="rodin"]{
  --font-ui:'FOT-Rodin ProN','Rodin ProN','Rodin ProN B','Zen Kaku Gothic New','M PLUS 1p',ui-sans-serif,system-ui,sans-serif;
}
body[data-font="sfmono"]{
  --font-ui:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;
}
body[data-font="ibmplex"]{
  --font-ui:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
}

body{
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.45;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* =====================================================
   4. THEMES
   ===================================================== */

/* ---------- CONSOLE DARK ---------- */
body[data-theme="console-dark"]{
  --bg:#0b0b0c;
  --bg-2:#111113;
  --bg-3:#060607;
  --surface:#0d0d0e;
  --panel:#131316;
  --panel-strong:#17171a;
  --surface-2:#1b1b20;
  --inset:#0f0f12;

  --text:#f2f2f4;
  --heading:#ffffff;
  --muted:#a7a7ad;
  --muted-2:#8b8b92;
  --muted-3:#6c6c72;

  --line:#2a2a2f;
  --line-soft:#1f1f23;
  --line-strong:#3a3a40;

  --card-shadow:none;
  --inset-shadow:inset 0 1px 0 rgba(255,255,255,.02);
  --modal-overlay:rgba(0,0,0,0.85);
}

/* ---------- CONSOLE LIGHT ---------- */
body[data-theme="console-light"]{
  --bg:#eeeef2;
  --bg-2:#f4f4f7;
  --bg-3:#e2e2e7;
  --surface:#ffffff;
  --panel:#ffffff;
  --panel-strong:#fbfbfd;
  --surface-2:#e8e8ed;
  --inset:#f7f7fa;

  --text:#1a1a1d;
  --heading:#0b0b0c;
  --muted:#5d5d66;
  --muted-2:#7a7a82;
  --muted-3:#9a9aa2;

  --line:#d4d4d9;
  --line-soft:#e4e4e9;
  --line-strong:#b8b8bf;

  --card-shadow:0 1px 2px rgba(0,0,0,.04);
  --inset-shadow:none;
  --modal-overlay:rgba(20,20,24,0.55);
}

/* ---------- GLASS DARK ---------- */
body[data-theme="glass-dark"]{
  --bg:#0a0a0c;
  --bg-2:#141416;
  --bg-3:#050506;
  --surface:rgba(36,36,38,0.50);
  --surface-2:rgba(52,52,54,0.58);
  --panel:rgba(24,24,26,0.62);
  --panel-strong:rgba(32,32,34,0.76);
  --inset:rgba(15,15,18,0.55);

  --text:#eaeaec;
  --heading:#ffffff;
  --muted:#b6b6b9;
  --muted-2:#909094;
  --muted-3:#6c6c72;

  --line:rgba(255,255,255,0.10);
  --line-soft:rgba(255,255,255,0.06);
  --line-strong:rgba(255,255,255,0.18);
  --glass-border:rgba(255,255,255,0.14);

  --card-shadow:0 8px 28px -8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  --inset-shadow:none;
  --modal-overlay:rgba(0,0,0,0.65);
}
body[data-theme="glass-dark"]{
  background:
    radial-gradient(circle at 15% 10%, rgba(var(--accent-rgb),.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(var(--accent-rgb),.06), transparent 50%),
    var(--bg);
}

/* ---------- GLASS LIGHT ---------- */
body[data-theme="glass-light"]{
  --bg:#b7caf0;
  --bg-2:#e4efff;
  --bg-3:#8aa3d4;
  --surface:rgba(255,255,255,0.28);
  --surface-2:rgba(255,255,255,0.48);
  --panel:rgba(255,255,255,0.42);
  --panel-strong:rgba(255,255,255,0.62);
  --inset:rgba(255,255,255,0.34);

  --text:#0f2744;
  --heading:#071a32;
  --muted:#304c6c;
  --muted-2:#4a6685;
  --muted-3:#6a7e94;

  --line:rgba(15,39,68,0.12);
  --line-soft:rgba(15,39,68,0.06);
  --line-strong:rgba(15,39,68,0.20);
  --glass-border:rgba(255,255,255,0.55);

  --card-shadow:0 8px 32px -10px rgba(15,39,68,.18);
  --inset-shadow:none;
  --modal-overlay:rgba(15,39,68,0.45);
}
body[data-theme="glass-light"]{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 50%),
    radial-gradient(circle at 80% 90%, rgba(var(--accent-rgb),.18), transparent 60%),
    linear-gradient(180deg, var(--bg-2), var(--bg));
}

/* ---------- BLUEPRINT DARK (neumorphism) ---------- */
body[data-theme="blueprint-dark"]{
  --bg:#1a1a1a;
  --bg-2:#1f1f1f;
  --bg-3:#141414;
  --surface:#1a1a1a;
  --surface-2:#202020;
  --panel:#1a1a1a;
  --panel-strong:#1c1c1c;
  --inset:#161616;

  --text:rgba(255,255,255,0.78);
  --heading:#ffffff;
  --muted:rgba(255,255,255,0.6);
  --muted-2:rgba(255,255,255,0.5);
  --muted-3:rgba(255,255,255,0.34);

  --line:rgba(255,255,255,0.05);
  --line-soft:rgba(255,255,255,0.03);
  --line-strong:rgba(255,255,255,0.10);

  --light-shadow:rgba(255,255,255,0.05);
  --dark-shadow:rgba(0,0,0,0.6);

  --shadow-level-1:3px 3px 6px var(--dark-shadow), -1px -1px 4px var(--light-shadow);
  --shadow-level-2:6px 6px 12px var(--dark-shadow), -3px -3px 10px var(--light-shadow);
  --shadow-level-3:8px 8px 18px var(--dark-shadow), -4px -4px 12px var(--light-shadow), 0 0 10px var(--accent-glow);
  --shadow-pressed:2px 2px 6px var(--dark-shadow), -1px -1px 4px var(--light-shadow);
  --shadow-inset:inset 2px 2px 5px var(--dark-shadow), inset -1px -1px 4px var(--light-shadow);
  --shadow-menu:10px 10px 25px rgba(0,0,0,0.45);

  --card-shadow:var(--shadow-level-2);
  --inset-shadow:var(--shadow-inset);
  --modal-overlay:rgba(0,0,0,0.7);
}

/* ---------- BLUEPRINT LIGHT ---------- */
body[data-theme="blueprint-light"]{
  --bg:#e8eaed;
  --bg-2:#f0f2f5;
  --bg-3:#dfe3e8;
  --surface:#e8eaed;
  --surface-2:#dde2e8;
  --panel:#e8eaed;
  --panel-strong:#edf0f4;
  --inset:#dde2e8;

  --text:rgba(26,26,26,0.80);
  --heading:#1a1a1a;
  --muted:rgba(26,26,26,0.62);
  --muted-2:rgba(26,26,26,0.5);
  --muted-3:rgba(26,26,26,0.36);

  --line:rgba(99,114,130,0.10);
  --line-soft:rgba(99,114,130,0.05);
  --line-strong:rgba(99,114,130,0.18);

  --light-shadow:rgba(255,255,255,0.85);
  --dark-shadow:rgba(163,177,198,0.7);

  --shadow-level-1:3px 3px 6px var(--dark-shadow), -1px -1px 4px var(--light-shadow);
  --shadow-level-2:6px 6px 12px var(--dark-shadow), -3px -3px 10px var(--light-shadow);
  --shadow-level-3:8px 8px 18px var(--dark-shadow), -4px -4px 12px var(--light-shadow), 0 0 10px var(--accent-glow);
  --shadow-pressed:2px 2px 6px var(--dark-shadow), -1px -1px 4px var(--light-shadow);
  --shadow-inset:inset 2px 2px 5px var(--dark-shadow), inset -1px -1px 4px var(--light-shadow);
  --shadow-menu:10px 10px 25px rgba(99,114,130,0.4);

  --card-shadow:var(--shadow-level-2);
  --inset-shadow:var(--shadow-inset);
  --modal-overlay:rgba(99,114,130,0.4);
}

/* =====================================================
   5. SHELL — sidebar + top bar + viewport
   ===================================================== */
.container{
  display:grid;
  grid-template-columns:var(--sidebar-width-desktop) minmax(0,1fr);
  grid-template-rows:var(--top-bar-height) minmax(0,1fr);
  height:100vh;
  transition:grid-template-columns .28s ease;
}
body.control-panel-is-collapsed .container{
  grid-template-columns:var(--sidebar-width-collapsed) minmax(0,1fr);
}

/* sidebar spans both rows on the left */
.control-panel{
  grid-column:1;
  grid-row:1 / span 2;
  background:var(--bg-2);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:hidden;
}
body[data-theme="glass-dark"] .control-panel,
body[data-theme="glass-light"] .control-panel{
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] .control-panel,
body[data-theme="blueprint-light"] .control-panel{
  background:var(--bg);
  border-right:none;
  box-shadow:inset -6px 0 12px var(--dark-shadow), inset 1px 0 4px var(--light-shadow);
}

.control-panel-scroll-inner{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:1.15rem 1rem;
  display:flex;
  flex-direction:column;
  gap:.85rem;
}
.control-panel-scroll-inner::-webkit-scrollbar{width:6px}
.control-panel-scroll-inner::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}

/* Sidebar header / user chip */
.cp-header{
  display:flex;
  align-items:center;
  gap:.7rem;
  padding:.25rem .25rem 1rem;
  border-bottom:1px solid var(--line-soft);
}
.avatar{
  width:var(--avatar-size);
  height:var(--avatar-size);
  border-radius:var(--radius-pill);
  background:linear-gradient(135deg,var(--accent),var(--accent-3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  font-size:1.05rem;
  flex-shrink:0;
  letter-spacing:.02em;
  cursor:pointer;
  overflow:hidden;
  transition:box-shadow .16s, transform .16s;
}
.avatar:hover{
  box-shadow:0 0 0 2px var(--accent-ring), 0 0 16px var(--accent-glow);
}
.avatar:focus-visible{
  outline:none;
  box-shadow:var(--focus-ring);
}
.avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:inherit;
}
.avatar.has-image{
  background:var(--inset);
}
body[data-theme="blueprint-dark"] .avatar,
body[data-theme="blueprint-light"] .avatar{
  box-shadow:var(--shadow-level-1);
}
.cp-user-info{flex:1;min-width:0}
.cp-username{
  color:var(--heading);
  font-weight:600;
  font-size:.95rem;
  letter-spacing:.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.save-status{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  font-family:var(--font-mono);
  font-size:.65rem;
  letter-spacing:.18em;
  color:var(--muted-2);
  text-transform:uppercase;
  margin-top:.2rem;
}
.save-status::before{
  content:'';
  width:.6rem;height:.6rem;
  border-radius:999px;
  background:var(--accent);
  box-shadow:0 0 12px var(--accent-glow);
}
.save-status::after{content:"SYNCED"}

/* Collapse toggle */
.cp-collapse{
  background:transparent;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  width:34px;height:34px;
  cursor:pointer;
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  transition:all .14s;
  flex-shrink:0;
}
.cp-collapse:hover{border-color:var(--accent);color:var(--accent)}
body[data-theme="blueprint-dark"] .cp-collapse,
body[data-theme="blueprint-light"] .cp-collapse{
  border:none;
  box-shadow:var(--shadow-level-1);
}
body[data-theme="blueprint-dark"] .cp-collapse:hover,
body[data-theme="blueprint-light"] .cp-collapse:hover{
  box-shadow:var(--shadow-level-3);
  color:var(--accent);
}

/* + Add Book button (primary) */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  height:var(--control-height);
  padding:0 .9rem;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface-2);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:.82rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:border-color .14s, background .14s, color .14s, box-shadow .2s, transform .2s;
}
.btn:hover{
  border-color:var(--accent);
  color:var(--accent);
}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.btn.primary:hover{
  background:var(--accent-2);
  border-color:var(--accent-2);
  color:#fff;
  filter:brightness(1.05);
}
.btn.danger:hover{border-color:var(--danger,#dc2626);color:var(--danger,#dc2626)}
.btn.full{width:100%}
.btn.small{height:32px;font-size:.72rem;padding:0 .7rem}

/* Glass buttons */
body[data-theme="glass-dark"] .btn,
body[data-theme="glass-light"] .btn{
  background:var(--surface);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
}
body[data-theme="glass-dark"] .btn:hover,
body[data-theme="glass-light"] .btn:hover{
  background:var(--surface-2);
  box-shadow:0 0 0 1px var(--accent-ring), 0 4px 18px -4px var(--accent-glow);
}

/* Blueprint buttons (raised) */
body[data-theme="blueprint-dark"] .btn,
body[data-theme="blueprint-light"] .btn{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-level-1);
}
body[data-theme="blueprint-dark"] .btn:hover,
body[data-theme="blueprint-light"] .btn:hover{
  box-shadow:var(--shadow-level-3);
  color:var(--accent);
}
body[data-theme="blueprint-dark"] .btn.primary,
body[data-theme="blueprint-light"] .btn.primary{
  background:var(--accent);
  box-shadow:var(--shadow-level-2), 0 0 0 1px rgba(255,255,255,.08) inset;
}
body[data-theme="blueprint-dark"] .btn:active,
body[data-theme="blueprint-light"] .btn:active{
  box-shadow:var(--shadow-pressed);
}

/* Sidebar section labels */
.cp-section-label{
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.20em;
  text-transform:uppercase;
  color:var(--muted-2);
  padding:0 .25rem;
  margin-top:.4rem;
}

/* Nav cards */
.nav-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.7rem .85rem;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  transition:all .14s;
  width:100%;
  font-family:var(--font-ui);
  font-size:.88rem;
  font-weight:500;
}
.nav-card:hover{border-color:var(--accent);color:var(--accent)}
.nav-card.active{
  border-color:var(--accent);
  background:rgba(var(--accent-rgb),.12);
  color:var(--accent);
  font-weight:600;
}
.nav-card .lbl{display:flex;align-items:center;gap:.55rem}
.nav-card .ico{
  width:1rem;height:1rem;
  display:inline-flex;
  align-items:center;justify-content:center;
  font-size:.85rem;
  color:var(--muted);
}
.nav-card.active .ico{color:var(--accent)}
.nav-count{
  font-family:var(--font-mono);
  font-size:.7rem;
  background:var(--inset);
  border:1px solid var(--line-soft);
  padding:.1rem .45rem;
  border-radius:var(--radius-pill);
  color:var(--muted);
  min-width:1.6rem;
  text-align:center;
}
.nav-card.active .nav-count{background:transparent;border-color:var(--accent);color:var(--accent)}
body[data-theme="glass-dark"] .nav-card,
body[data-theme="glass-light"] .nav-card{
  background:var(--surface);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] .nav-card,
body[data-theme="blueprint-light"] .nav-card{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-level-1);
}
body[data-theme="blueprint-dark"] .nav-card.active,
body[data-theme="blueprint-light"] .nav-card.active{
  box-shadow:var(--shadow-inset);
  background:var(--bg);
}
body[data-theme="blueprint-dark"] .nav-card:hover,
body[data-theme="blueprint-light"] .nav-card:hover{
  box-shadow:var(--shadow-level-3);
}

/* Total summary panel */
.total-summary{
  padding:.85rem;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface);
}
.total-summary .ts-lbl{
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.20em;
  text-transform:uppercase;
  color:var(--muted-2);
  margin-bottom:.45rem;
}
.total-summary .ts-num{
  font-size:1.45rem;
  font-weight:700;
  color:var(--heading);
  letter-spacing:-.01em;
}
.total-summary .ts-sub{
  font-size:.78rem;
  color:var(--muted);
  margin-top:.15rem;
}
.progress-track{
  margin-top:.6rem;
  height:6px;
  background:var(--inset);
  border-radius:var(--radius-pill);
  overflow:hidden;
  position:relative;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow);
  transition:width .4s cubic-bezier(.2,.8,.2,1);
}
body[data-theme="blueprint-dark"] .total-summary,
body[data-theme="blueprint-light"] .total-summary{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-inset);
}
body[data-theme="glass-dark"] .total-summary,
body[data-theme="glass-light"] .total-summary{
  background:var(--surface);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
}

/* Collapsible section (Settings) */
.collapsible{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface);
  overflow:hidden;
}
.collapsible summary{
  list-style:none;
  cursor:pointer;
  padding:.7rem .85rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.88rem;
  font-weight:500;
  color:var(--heading);
}
.collapsible summary::-webkit-details-marker{display:none}
.collapsible summary::after{
  content:'+';
  font-family:var(--font-mono);
  color:var(--muted);
  transition:transform .2s;
}
.collapsible[open] summary::after{content:'−'}
.collapsible-body{padding:0 .85rem .85rem;display:flex;flex-direction:column;gap:.85rem}
body[data-theme="blueprint-dark"] .collapsible,
body[data-theme="blueprint-light"] .collapsible{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-level-1);
}
body[data-theme="glass-dark"] .collapsible,
body[data-theme="glass-light"] .collapsible{
  background:var(--surface);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
}

.field-row{display:flex;flex-direction:column;gap:.4rem}
.field-row > label{
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted-2);
}

/* Theme tile picker */
.theme-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.theme-tile{
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--surface-2);
  cursor:pointer;
  padding:.45rem .35rem;
  font-size:.65rem;
  font-family:var(--font-mono);
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  text-align:center;
  transition:all .14s;
}
.theme-tile:hover{border-color:var(--accent);color:var(--accent)}
.theme-tile.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.12);color:var(--accent)}

/* Mode toggle */
.mode-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.mode-seg button{
  background:transparent;border:none;cursor:pointer;
  padding:.45rem;
  color:var(--muted);
  font-family:var(--font-mono);
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.mode-seg button.active{background:var(--accent);color:#fff}

/* Accent picker */
.accent-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:.3rem;
}
.accent-dot{
  width:100%;
  aspect-ratio:1;
  border-radius:var(--radius-pill);
  cursor:pointer;
  border:2px solid transparent;
  transition:all .14s;
  position:relative;
}
.accent-dot.active{
  transform:scale(1.15);
  box-shadow:0 0 0 2px var(--bg), 0 0 0 4px currentColor;
}

/* Font select */
.font-select{
  width:100%;
  height:var(--control-height);
  padding:0 .7rem;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--inset);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:.88rem;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) center, calc(100% - 13px) center;
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
  cursor:pointer;
  padding-right:2.4rem;
}
.font-select:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring)}
body[data-theme="blueprint-dark"] .font-select,
body[data-theme="blueprint-light"] .font-select{
  border:none;
  box-shadow:var(--shadow-inset);
}

/* =====================================================
   6. TOP APP BAR
   ===================================================== */
.top-app-bar{
  grid-column:2;
  grid-row:1;
  display:grid;
  grid-template-columns:max-content minmax(0,1fr) auto;
  gap:.9rem;
  align-items:center;
  padding:0 var(--content-padding-x);
  border-bottom:1px solid var(--line);
  background:var(--bg);
  overflow:hidden;
}
body[data-theme="glass-dark"] .top-app-bar,
body[data-theme="glass-light"] .top-app-bar{
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] .top-app-bar,
body[data-theme="blueprint-light"] .top-app-bar{
  background:var(--bg);
  border-bottom:none;
  box-shadow:inset 0 -6px 12px var(--dark-shadow), inset 0 1px 4px var(--light-shadow);
}

.view-title{
  font-size:1.55rem;
  font-weight:700;
  color:var(--heading);
  margin:0;
  letter-spacing:-.005em;
  white-space:nowrap;
}
.top-view-toolbar{
  display:grid;
  grid-template-columns:minmax(12rem,1fr) minmax(8.75rem,10.5rem);
  gap:var(--menu-bar-control-gap);
  min-width:0;
}
.input,.select,textarea{
  height:var(--control-height);
  padding:0 .75rem;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--inset);
  color:var(--text);
  font-family:var(--font-ui);
  font-size:.88rem;
  width:100%;
}
textarea{padding:.55rem .75rem;height:auto;line-height:1.5;resize:vertical;min-height:80px}
.input:focus,.select:focus,textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:var(--focus-ring);
}
.input::placeholder{color:var(--muted-3)}
.select{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) center, calc(100% - 13px) center;
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
  cursor:pointer;
  padding-right:2.4rem;
}
body[data-theme="glass-dark"] .input,
body[data-theme="glass-light"] .input,
body[data-theme="glass-dark"] .select,
body[data-theme="glass-light"] .select,
body[data-theme="glass-dark"] textarea,
body[data-theme="glass-light"] textarea{
  background:var(--surface);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] .input,
body[data-theme="blueprint-light"] .input,
body[data-theme="blueprint-dark"] .select,
body[data-theme="blueprint-light"] .select,
body[data-theme="blueprint-dark"] textarea,
body[data-theme="blueprint-light"] textarea{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-inset);
}

.brand-logo{
  font-weight:800;
  font-size:1.25rem;
  letter-spacing:.32em;
  color:var(--heading);
  display:flex;
  align-items:center;
  gap:.45rem;
}
.brand-logo .dot{
  width:.4rem;height:.4rem;
  background:var(--accent);
  border-radius:999px;
  box-shadow:0 0 10px var(--accent-glow);
}

/* =====================================================
   7. VIEWPORT + GRID
   ===================================================== */
.viewport{
  grid-column:2;
  grid-row:2;
  overflow-y:auto;
  overflow-x:hidden;
  padding:var(--content-padding-y) var(--content-padding-x) 1.5rem;
  background:var(--bg);
}
body[data-theme="glass-dark"] .viewport,
body[data-theme="glass-light"] .viewport{
  background:transparent;
}
.viewport::-webkit-scrollbar{width:8px}
.viewport::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}

.view{display:none}
.view.active{display:block}

.project-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,var(--project-card-width-desktop)));
  gap:var(--project-grid-gap);
  justify-content:start;
}
@media (max-width:1450px){
  .project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .project-grid{grid-template-columns:minmax(0,1fr)}
}

/* =====================================================
   8. PROJECT (BOOK) CARD
   ===================================================== */
.project-card{
  height:var(--project-card-height-desktop);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:var(--panel);
  padding:1rem;
  display:grid;
  grid-template-rows:13rem auto auto 1fr auto;
  gap:.55rem;
  cursor:pointer;
  transition:transform .2s, border-color .2s, box-shadow .2s;
  box-shadow:var(--card-shadow);
  position:relative;
  overflow:hidden;
}
.project-card:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}
body[data-theme="glass-dark"] .project-card,
body[data-theme="glass-light"] .project-card{
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
}
body[data-theme="glass-dark"] .project-card:hover,
body[data-theme="glass-light"] .project-card:hover{
  box-shadow:0 12px 36px -8px var(--accent-glow), 0 0 0 1px var(--accent-ring);
}
body[data-theme="blueprint-dark"] .project-card,
body[data-theme="blueprint-light"] .project-card{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-level-2);
}
body[data-theme="blueprint-dark"] .project-card:hover,
body[data-theme="blueprint-light"] .project-card:hover{
  box-shadow:var(--shadow-level-3);
  transform:translateY(-4px);
}

.cover-frame{
  height:13rem;
  background:var(--inset);
  border-radius:var(--radius-sm);
  border:1px solid var(--line-soft);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
body[data-theme="blueprint-dark"] .cover-frame,
body[data-theme="blueprint-light"] .cover-frame{
  border:none;
  box-shadow:var(--shadow-inset);
}
.cover-frame img{width:auto;height:100%;object-fit:cover;display:block;max-width:100%}
.cover-fallback{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
  text-align:center;
  font-size:.75rem;
  color:var(--muted-2);
  font-family:var(--font-mono);
  letter-spacing:.1em;
}
.card-title{
  font-size:1.05rem;
  font-weight:700;
  color:var(--heading);
  margin:0;
  line-height:1.25;
  letter-spacing:-.005em;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card-author{
  font-size:.85rem;
  color:var(--muted);
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-meta-row{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  align-items:center;
  font-family:var(--font-mono);
  font-size:.66rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted-2);
}
.card-meta-row .dot-sep{opacity:.5}
.card-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:.5rem;
}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  padding:.22rem .55rem;
  border-radius:var(--radius-pill);
  border:1px solid var(--line);
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.status-pill::before{
  content:'';
  width:.4rem;height:.4rem;
  border-radius:999px;
  background:currentColor;
}
.status-pill.read{color:#5dd6a0;border-color:rgba(93,214,160,.4)}
.status-pill.reading{color:#f0b056;border-color:rgba(240,176,86,.4)}
.status-pill.want{color:var(--muted);border-color:var(--line)}
.metadata-pill{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  padding:.22rem .55rem;
  border-radius:var(--radius-pill);
  border:1px solid var(--accent-ring);
  color:var(--accent);
  font-family:var(--font-mono);
  font-size:.58rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  background:rgba(var(--accent-rgb),.10);
}
.metadata-pill::before{
  content:'';
  width:.38rem;
  height:.38rem;
  border-radius:999px;
  background:currentColor;
  box-shadow:0 0 10px var(--accent-glow);
  animation:metadataPulse 1s ease-in-out infinite;
}
@keyframes metadataPulse{
  0%,100%{opacity:.35;transform:scale(.85)}
  50%{opacity:1;transform:scale(1)}
}
.loan-pill{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  padding:.22rem .55rem;
  border-radius:var(--radius-pill);
  font-family:var(--font-mono);
  font-size:.6rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  background:rgba(var(--accent-rgb),.14);
  color:var(--accent);
  border:1px solid var(--accent-ring);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:60%;
}
.rating{
  font-size:.85rem;
  color:var(--accent);
  letter-spacing:.06em;
}
.rating .empty{color:var(--muted-3)}



/* Horizontal book-card layout: cover belongs to the main card, data stays readable */
.project-card{
  height:16.25rem;
  grid-template-columns:7.4rem minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  align-items:stretch;
  gap:1rem;
}
.cover-frame{
  grid-column:1;
  grid-row:1;
  width:100%;
  height:100%;
  min-height:0;
  align-self:stretch;
  background:transparent;
  border:none;
  box-shadow:none !important;
  border-radius:var(--radius-sm);
}
.cover-frame img{
  width:100%;
  height:100%;
  max-width:none;
  object-fit:contain;
  object-position:center center;
  border-radius:var(--radius-sm);
}
.cover-fallback{
  border:1px solid var(--line-soft);
  border-radius:var(--radius-sm);
  background:var(--inset);
  min-height:100%;
}
.card-content{
  grid-column:2;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:.35rem;
  overflow:hidden;
}
.card-title{
  font-size:1rem;
  line-height:1.18;
  -webkit-line-clamp:2;
  overflow-wrap:anywhere;
}
.card-author{
  white-space:normal;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  line-height:1.22;
}
.card-meta-row{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:.28rem;
  min-width:0;
  font-size:.61rem;
  letter-spacing:.10em;
  line-height:1.25;
}
.card-meta-line{
  width:100%;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.card-meta-line.wrap{
  white-space:normal;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.card-meta-row .dot-sep{display:none}
.card-bottom{
  margin-top:auto;
  min-width:0;
}
.card-bottom > div:first-child{min-width:0}
.status-pill,.loan-pill,.metadata-pill{max-width:100%}
.metadata-pill{
  position:absolute;
  top:.7rem;
  right:.7rem;
  z-index:2;
  max-width:calc(100% - 1.4rem);
}
@media (max-width:520px){
  .project-card{grid-template-columns:6.2rem minmax(0,1fr);height:15.25rem;gap:.8rem}
}

/* Empty state */
.empty-state{
  border:1px dashed var(--line-strong);
  border-radius:var(--radius-md);
  padding:3rem 2rem;
  text-align:center;
  color:var(--muted);
  margin:2rem 0;
}
.empty-state .quote{
  font-size:1.2rem;
  color:var(--heading);
  font-weight:600;
  margin-bottom:.5rem;
  letter-spacing:-.005em;
}
.empty-state .sub{font-size:.92rem;color:var(--muted-2)}

/* =====================================================
   9. INSIGHTS VIEW
   ===================================================== */
.insights-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem;
  margin-bottom:1rem;
}
.insights-grid.two{grid-template-columns:1.2fr 1fr}
.insights-grid.split{grid-template-columns:1fr 1fr}
@media (max-width:1100px){.insights-grid,.insights-grid.two,.insights-grid.split{grid-template-columns:1fr}}

.panel{
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:var(--panel);
  padding:1.1rem;
}
body[data-theme="glass-dark"] .panel,
body[data-theme="glass-light"] .panel{
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] .panel,
body[data-theme="blueprint-light"] .panel{
  background:var(--bg);
  border:none;
  box-shadow:var(--shadow-level-2);
}
.panel h3{
  font-family:var(--font-mono);
  font-size:.66rem;
  letter-spacing:.20em;
  text-transform:uppercase;
  color:var(--muted-2);
  margin:0 0 .9rem;
  font-weight:600;
}
.chart-wrap{position:relative;height:200px;margin-bottom:.6rem}
.chart-legend{display:flex;flex-direction:column;gap:.3rem;font-size:.82rem}
.lg-row{display:flex;align-items:center;gap:.55rem}
.lg-swatch{width:.65rem;height:.65rem;flex-shrink:0;border-radius:2px}
.lg-name{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-val{font-family:var(--font-mono);font-size:.7rem;color:var(--muted)}

.profile-text{font-size:1.05rem;line-height:1.55;color:var(--text)}
.profile-text strong{color:var(--accent);font-weight:700}
.profile-text .num{color:var(--heading);font-weight:700}

.reco{
  padding:.7rem .85rem;
  border-left:3px solid var(--accent);
  background:rgba(var(--accent-rgb),.06);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom:.5rem;
  font-size:.92rem;
  line-height:1.45;
}
.reco strong{color:var(--accent);font-weight:700}

.stat-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:.55rem 0;
  border-bottom:1px solid var(--line-soft);
}
.stat-row:last-child{border-bottom:none}
.stat-row .key{font-size:.85rem;color:var(--muted)}
.stat-row .val{font-family:var(--font-mono);font-size:.92rem;color:var(--heading)}

.data-actions{display:flex;gap:.5rem;flex-wrap:wrap}

/* =====================================================
   10. DIALOGS
   ===================================================== */
dialog{
  border:none;
  padding:0;
  background:var(--panel);
  color:var(--text);
  max-width:680px;
  width:92%;
  border-radius:var(--radius-md);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.45);
  font-family:var(--font-ui);
}
dialog::backdrop{background:var(--modal-overlay);backdrop-filter:blur(6px)}
body[data-theme="glass-dark"] dialog,
body[data-theme="glass-light"] dialog{
  background:var(--panel-strong);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--glass-border);
}
body[data-theme="blueprint-dark"] dialog,
body[data-theme="blueprint-light"] dialog{
  background:var(--bg);
  box-shadow:var(--shadow-menu);
}
.dialog-inner{padding:1.5rem 1.6rem 1.6rem}
.dialog-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:1rem;
  border-bottom:1px solid var(--line-soft);
  margin-bottom:1.1rem;
}
.dialog-head h3{
  font-size:1.25rem;
  font-weight:700;
  color:var(--heading);
  margin:0;
  letter-spacing:-.005em;
}
.x-btn{
  background:transparent;
  border:none;
  cursor:pointer;
  color:var(--muted);
  width:32px;height:32px;
  border-radius:var(--radius-sm);
  display:inline-flex;
  align-items:center;justify-content:center;
  font-size:1rem;
  transition:all .14s;
}
.x-btn:hover{color:var(--danger,#dc2626);background:rgba(220,38,38,.08)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:1rem}
.add-mode-seg{grid-template-columns:repeat(4,1fr)}
.seg button{
  background:transparent;border:none;cursor:pointer;
  padding:.6rem;color:var(--muted);
  font-family:var(--font-ui);font-size:.82rem;font-weight:600;
  letter-spacing:.04em;
}
.seg button.active{background:var(--accent);color:#fff}

.field{margin-bottom:.85rem}
.field label{
  display:block;
  font-family:var(--font-mono);
  font-size:.62rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted-2);
  margin-bottom:.35rem;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}

.results{
  max-height:320px;
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  margin-top:.5rem;
}
.result-item{
  padding:.6rem .75rem;
  border-bottom:1px solid var(--line-soft);
  cursor:pointer;
  display:flex;
  gap:.7rem;
  align-items:center;
  transition:background .14s;
}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:var(--surface-2)}
.result-item img{width:36px;height:54px;object-fit:cover;flex-shrink:0;background:var(--inset);border-radius:3px}
.result-item .ri-info{flex:1;min-width:0}
.result-item .ri-title{font-size:.92rem;font-weight:600;color:var(--heading);line-height:1.25}
.result-item .ri-author{font-size:.78rem;color:var(--muted)}

.form-actions{

.detail-top{display:flex;gap:1rem;margin-bottom:1rem}
.detail-cover{

  background:var(--inset);
  border-radius:var(--radius-sm);
  border:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:center;

}

.cover-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center}
.cover-results{
  display:grid;

/* Operation status dialog */
.operation-status{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:1rem;

/* Toast */

<script>
'use strict';

/* ==========================================================
   STORAGE LAYER
   ========================================================== */
const KEYS = {
  books: 'codex_books',
  prefs: 'codex_prefs',
};

const API_BASE = (window.CODEX_API_BASE || '').replace(/\/$/, '');
const CODEX_CLIENT_ID_KEY = 'codex_client_id';

function getCodexClientId(){
  try {
    let id = localStorage.getItem(CODEX_CLIENT_ID_KEY);
    if (!id){
      const rand = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      id = `codex-${rand}`;
      localStorage.setItem(CODEX_CLIENT_ID_KEY, id);
    }
    return id;
  } catch {
    return 'codex-browser-session';
  }
}

async function apiRequest(path, options = {}){
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'X-Codex-Client': getCodexClientId(),
      ...(options.headers || {})
    },
    cache: 'no-store'
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return data;
}

function readLocal(key){
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function writeLocal(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const storage = {
  async get(key){
    try {
      if (key === KEYS.books){
        const data = await apiRequest('/api/books');
        writeLocal(key, data.books || []);
        return data.books || [];
      }
      if (key === KEYS.prefs){
        const data = await apiRequest('/api/prefs');
        if (data.prefs) writeLocal(key, data.prefs);
        return data.prefs || null;
      }
    } catch (err){
      console.warn('CODEX backend unavailable; using local browser storage.', err);
    }

    if (window.storage){
      try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch {}
    }
    return readLocal(key);
  },
  async set(key, val){
    writeLocal(key, val);
    try {
      if (key === KEYS.books){
        const data = await apiRequest('/api/books', { method:'PUT', body: JSON.stringify({ books: val }) });
        return { ok:true, remoteSaved:true, mongoReady:data.mongoReady !== false, mode:data.mode || 'mongodb' };
      }
      if (key === KEYS.prefs){
        const data = await apiRequest('/api/prefs', { method:'PUT', body: JSON.stringify({ prefs: val }) });
        return { ok:true, remoteSaved:true, mongoReady:data.mongoReady !== false, mode:data.mode || 'mongodb' };
      }
    } catch (err){
      console.warn('CODEX backend save failed; data was saved locally in this browser.', err);
      if (window.storage){
        try { await window.storage.set(key, JSON.stringify(val)); } catch {}
      }
      return { ok:false, remoteSaved:false, mongoReady:false, mode:'local', error:err };
    }

    if (window.storage){
      try { await window.storage.set(key, JSON.stringify(val)); } catch {}
    }
    return { ok:true, remoteSaved:false, mongoReady:false, mode:'local' };
  }
};

function hexToRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const s = v => Math.max(0, Math.min(255, Math.round(v + amt)));
  return `#${[s(r),s(g),s(b)].map(v => v.toString(16).padStart(2,'0')).join('')}`;
}

async function olSearch(q, limit = 10){
  const fields = 'title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,subject,key,language,publisher,edition_count';
  const params = new URLSearchParams({ q, limit:String(limit), fields });
  const data = await apiRequest(`/api/metadata/openlibrary/search?${params.toString()}`);
  return data.docs || [];
}
async function olTitleSearch(title, author = ''){
  const fields = 'title,author_name,first_publish_year,isbn,cover_i,number_of_pages_median,subject,key,language,publisher,edition_count';
  const buildParams = includeAuthor => {
    const params = new URLSearchParams({ title, limit:'12', fields });
    if (includeAuthor && author) params.set('author', author);
    return params;
  };
  let data = await apiRequest(`/api/metadata/openlibrary/search?${buildParams(true).toString()}`);
  let docs = data.docs || [];
  if (!docs.length && author){
    data = await apiRequest(`/api/metadata/openlibrary/search?${buildParams(false).toString()}`);
    docs = data.docs || [];
  }
  return docs;
}
async function googleBooksQuery(q, maxResults = 12){
  if (!String(q || '').trim()) return [];
  const params = new URLSearchParams({ q, maxResults:String(maxResults), printType:'books', langRestrict:'en' });
  const data = await apiRequest(`/api/metadata/google/books?${params.toString()}`);
  return data.items || [];
}
async function googleBooksSearch(title, author = ''){
  const q = [title ? `intitle:${title}` : '', author ? `inauthor:${author}` : ''].filter(Boolean).join(' ');
  return googleBooksQuery(q, 12);
}
function googleCoverUrl(info = {}){
  const links = info.imageLinks || {};
  const url = links.extraLarge || links.large || links.medium || links.small || links.thumbnail || links.smallThumbnail || '';
  return String(url || '').replace(/^http:/, 'https:').replace(/&edge=curl/g, '');
}
function metadataFromGoogleVolume(item){
  const info = item?.volumeInfo || {};
  const isbn = (info.industryIdentifiers || []).find(x => /ISBN_13/i.test(x.type))
    || (info.industryIdentifiers || []).find(x => /ISBN_10/i.test(x.type));
  const year = parseInt(String(info.publishedDate || '').match(/\d{4}/)?.[0]) || null;
  return {
    title: englishText(info.title) || '',
    author: pickEnglishAuthor(info.authors || []) || '',
    pages: info.pageCount || null,
    genre: pickGenre(info.categories || []),
    year,
    isbn: isbn?.identifier || '',
    coverUrl: googleCoverUrl(info),
    series: inferSeriesFromTitle(info.title || '', info.subtitle || ''),
    metadataUpdatedAt: Date.now(),
  };
}
function inferSeriesFromTitle(title, subtitle = ''){
  const joined = [title, subtitle].filter(Boolean).join(' ');
  const match = joined.match(/(?:book|volume|vol\.?|part)\s+\d+\s+(?:of|in)\s+(.+)$/i)
    || joined.match(/\(([^)]*(?:series|trilogy|saga|collection|cycle|chronicles)[^)]*)\)/i);
  return match ? englishText(match[1]) : '';
}
function scoreMetadataCandidate(metadata, title, author = ''){
  return metadataScore({
    title: metadata.title,
    author_name: metadata.author ? [metadata.author] : [],
    first_publish_year: metadata.year,
    isbn: metadata.isbn ? [metadata.isbn] : [],
    cover_i: metadata.coverUrl ? 1 : null,
    number_of_pages_median: metadata.pages,
    subject: metadata.genre ? [metadata.genre] : [],
    language: ['eng'],
    series: metadata.series ? [metadata.series] : [],
  }, title, author);
}
function mergeCrossReferencedMetadata(base, candidates){
  const out = { ...base };
  for (const c of candidates){
    if (!c) continue;
    if (!out.author && c.author) out.author = c.author;
    if (!out.pages && c.pages) out.pages = c.pages;
    if (!out.genre && c.genre) out.genre = c.genre;
    if (!out.year && c.year) out.year = c.year;
    if (!out.isbn && c.isbn) out.isbn = c.isbn;
    if (!out.coverUrl && c.coverUrl) out.coverUrl = c.coverUrl;
    if (!out.series && c.series) out.series = c.series;
  }
  out.metadataUpdatedAt = Date.now();
  return out;
}
async function olISBN(isbn){
  const clean = isbn.replace(/[-\s]/g,'');
  const params = new URLSearchParams({ bibkeys:`ISBN:${clean}`, format:'json', jscmd:'data' });
  const j = await apiRequest(`/api/metadata/openlibrary/books?${params.toString()}`);
  const book = j[`ISBN:${clean}`];
  if (!book) return null;
  return {
    title: book.title,
    author_name: (book.authors||[]).map(a=>a.name),
    first_publish_year: book.publish_date ? parseInt(book.publish_date.match(/\d{4}/)?.[0]) : null,
    isbn: [clean],
    number_of_pages_median: book.number_of_pages,
    subject: (book.subjects||[]).map(s=>s.name),
    cover: book.cover,
    language: ['eng'],
  };
}
async function olWorkDetails(key){
  if (!key || !key.startsWith('/works/')) return null;
  try {
    const workId = key.replace('/works/', '').replace(/[^a-zA-Z0-9]/g, '');
    if (!workId) return null;
    return await apiRequest(`/api/metadata/openlibrary/work/${encodeURIComponent(workId)}`);
  } catch {
    return null;
  }
}
function olCoverUrl(doc){
  if (doc.coverUrl) return doc.coverUrl;
  if (doc.cover && doc.cover.medium) return doc.cover.medium;
  if (doc.cover_i) return `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
  if (doc.isbn && doc.isbn[0]) return `https://covers.openlibrary.org/b/isbn/${doc.isbn[0]}-L.jpg`;
  return null;
}
function isMostlyEnglishText(value){
  const s = String(value || '').trim();
  if (!s) return false;
  const letters = s.match(/[A-Za-z]/g)?.length || 0;
  const nonLatin = s.match(/[^\x00-\x7F]/g)?.length || 0;
  return letters > 0 && nonLatin <= Math.max(2, Math.floor(s.length * 0.08));
}
function englishText(value){
  const s = String(value || '').trim();
  return isMostlyEnglishText(s) ? s : '';
}
function pickEnglishAuthor(authors){
  const list = Array.isArray(authors) ? authors : [authors];
  return list.map(englishText).find(Boolean) || '';
}
function pickGenre(subjects){
  if (!subjects || !subjects.length) return '';
  const blocked = /fictional|protected daisy|accessible book|internet archive|open library|large type|juvenile|translations/i;
  const clean = subjects
    .map(s => typeof s === 'string' ? s : (s?.name ?? ''))
    .map(englishText)
    .filter(Boolean)
    .filter(s => !s.includes(':') && s.length < 42 && !blocked.test(s));
  return clean[0] || '';
}
function pickSeriesOrCollection(doc, workDetails = null){
  const direct = [doc?.series, workDetails?.series].flat().filter(Boolean).map(englishText).filter(Boolean);
  if (direct.length) return direct[0];
  const subjects = [doc?.subject, workDetails?.subjects].flat().filter(Boolean).map(englishText).filter(Boolean);
  const seriesLike = subjects.find(s => /(series|collection|cycle|saga|trilogy|cantos|chronicles|universe|novels)/i.test(s));
  return seriesLike || '';
}
function normalizeMetadataTitle(title){
  return String(title || '')
    .toLowerCase()
    .replace(/&/g, ' and ')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function normalizeAuthor(author){
  return String(author || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}
function metadataScore(doc, title, author = ''){
  const wanted = normalizeMetadataTitle(title);
  const found = normalizeMetadataTitle(doc?.title || '');
  if (!wanted || !found) return 0;
  let score = 0;
  if (found === wanted) score += 100;
  else if (found.startsWith(wanted) || wanted.startsWith(found)) score += 70;
  else if (found.includes(wanted) || wanted.includes(found)) score += 45;
  else {
    const wantedWords = new Set(wanted.split(' ').filter(Boolean));
    const foundWords = found.split(' ').filter(Boolean);
    const overlap = foundWords.filter(w => wantedWords.has(w)).length;
    score += overlap * 8;
  }
  const wantedAuthor = normalizeAuthor(author);
  const authors = (doc.author_name || []).map(normalizeAuthor).filter(Boolean);
  if (authors.length) score += 12;
  if (wantedAuthor){
    const exactAuthor = authors.some(a => a === wantedAuthor);
    const looseAuthor = authors.some(a => a.includes(wantedAuthor) || wantedAuthor.includes(a));
    if (exactAuthor) score += 90;
    else if (looseAuthor) score += 55;
    else score -= 45;
  }
  const languages = doc.language || [];
  if (languages.includes('eng')) score += 18;
  if (doc.cover_i || (doc.isbn || []).length) score += 10;
  if (doc.number_of_pages_median) score += 6;
  if ((doc.subject || []).length) score += 6;
  if (doc.first_publish_year) score += 4;
  if (doc.series) score += 4;
  return score;
}
function metadataFromDoc(doc, workDetails = null){
  return {
    title: englishText(doc.title) || '',
    author: pickEnglishAuthor(doc.author_name || []) || '',
    pages: doc.number_of_pages_median || null,
    genre: pickGenre([doc.subject, workDetails?.subjects].flat().filter(Boolean)),
    year: doc.first_publish_year || null,
    isbn: (doc.isbn || [])[0] || '',
    coverUrl: olCoverUrl(doc) || '',
    series: pickSeriesOrCollection(doc, workDetails),
    metadataUpdatedAt: Date.now(),
  };
}
async function fetchBookMetadata(title, author = ''){
  const [olResult, googleResult] = await Promise.allSettled([
    olTitleSearch(title, author),
    googleBooksSearch(title, author)
  ]);

  const candidates = [];
  const olDocs = olResult.status === 'fulfilled' ? olResult.value : [];
  const rankedOl = olDocs
    .map(doc => ({ doc, score: metadataScore(doc, title, author) }))
    .filter(item => item.score >= (author ? 45 : 35))
    .sort((a,b) => b.score - a.score)
    .slice(0, 4);

  for (const item of rankedOl){
    const workDetails = await olWorkDetails(item.doc.key);
    const metadata = metadataFromDoc(item.doc, workDetails);
    candidates.push({ source:'Open Library', metadata, score:item.score });
  }

  const googleItems = googleResult.status === 'fulfilled' ? googleResult.value : [];
  googleItems.forEach(item => {
    const metadata = metadataFromGoogleVolume(item);
    const score = scoreMetadataCandidate(metadata, title, author);
    if (score >= (author ? 45 : 35)) candidates.push({ source:'Google Books', metadata, score });
  });

  candidates.sort((a,b) => b.score - a.score);
  if (!candidates.length) return null;

  const best = candidates[0].metadata;
  const trustedMatches = candidates
    .slice(1)
    .filter(c => c.score >= Math.max(35, candidates[0].score - 35))
    .map(c => c.metadata);
  return mergeCrossReferencedMetadata(best, trustedMatches);
}
async function fetchMetadataFromISBN(isbn){
  const doc = await olISBN(isbn);
  return doc ? metadataFromDoc(doc) : null;
}
function mergeMetadata(book, metadata, options = {}){
  if (!metadata) return book;
  const overwrite = !!options.overwrite;
  return {
    ...book,
    title: book.title || metadata.title || '',
    author: book.author || metadata.author || '',
    pages: overwrite ? (metadata.pages || book.pages || null) : (book.pages || metadata.pages || null),
    genre: overwrite ? (metadata.genre || book.genre || '') : (book.genre || metadata.genre || ''),
    year: overwrite ? (metadata.year || book.year || null) : (book.year || metadata.year || null),
    isbn: overwrite ? (metadata.isbn || book.isbn || '') : (book.isbn || metadata.isbn || ''),
    coverUrl: overwrite ? (metadata.coverUrl || book.coverUrl || '') : (book.coverUrl || metadata.coverUrl || ''),
    series: overwrite ? (metadata.series || book.series || '') : (book.series || metadata.series || ''),
    metadataUpdatedAt: metadata.metadataUpdatedAt || Date.now(),
  };
}
async function enrichBookMetadata(book, options = {}){
  if (!book?.title) return book;
  try {
    const metadata = book.isbn ? await fetchMetadataFromISBN(book.isbn) : await fetchBookMetadata(book.title, book.author || '');
    return mergeMetadata(book, metadata, options);
  } catch {
    return book;
  }
}
async function enrichBooksMetadata(books, onProgress = null){
  const enriched = [];
  for (let i = 0; i < books.length; i++){
    if (onProgress) onProgress(i + 1, books.length, books[i]);
    enriched.push(await enrichBookMetadata(books[i]));
  }
  return enriched;
}
function findCoverChoicesFromDocs(docs){
  return docs.map(doc => ({

    author: pickEnglishAuthor(doc.author_name || []) || '',

function findCoverChoicesFromGoogle(items){

function isbnCoverChoices(isbn){
  const clean = String(isbn || '').replace(/[-\s]/g,'');

  return ['L','M'].map(size => ({

    source: 'Open Library ISBN',

async function getCoverChoices(title, author = '', isbn = ''){
  const [olResult, googleResult] = await Promise.allSettled([
    olTitleSearch(title, author),
    googleBooksSearch(title, author)
  ]);
  const choices = [
    ...isbnCoverChoices(isbn),
    ...findCoverChoicesFromDocs(olResult.status === 'fulfilled' ? olResult.value : []),
    ...findCoverChoicesFromGoogle(googleResult.status === 'fulfilled' ? googleResult.value : [])
  ];
  const seen = new Set();
  return choices
    .map(choice => ({ ...choice, score: scoreMetadataCandidate(choice, title, author) }))
    .filter(choice => {
      if (!choice.coverUrl || seen.has(choice.coverUrl)) return false;
      seen.add(choice.coverUrl);
      return true;
    })
    .sort((a,b) => b.score - a.score)
    .slice(0, 18);
}

function seriesTitleKey(book){
  return `${normalizeMetadataTitle(book?.title)}::${normalizeAuthor(book?.author)}`;
}
function seriesCandidateScore(book, series, author = ''){
  const seriesNorm = normalizeMetadataTitle(series);
  const titleNorm = normalizeMetadataTitle(book?.title);
  const bookSeriesNorm = normalizeMetadataTitle(book?.series);
  if (!seriesNorm || !titleNorm) return 0;
  let score = 0;
  if (bookSeriesNorm){
    if (bookSeriesNorm === seriesNorm) score += 120;
    else if (bookSeriesNorm.includes(seriesNorm) || seriesNorm.includes(bookSeriesNorm)) score += 80;
  }
  const seriesWords = seriesNorm.split(' ').filter(w => w.length > 2);
  const titleOverlap = seriesWords.filter(w => titleNorm.includes(w)).length;
  score += titleOverlap * 10;
  const wantedAuthor = normalizeAuthor(author);
  const foundAuthor = normalizeAuthor(book?.author);
  if (wantedAuthor && foundAuthor){
    if (foundAuthor === wantedAuthor) score += 35;
    else if (foundAuthor.includes(wantedAuthor) || wantedAuthor.includes(foundAuthor)) score += 18;
  }
  if (book?.year) score += 4;
  if (book?.coverUrl) score += 4;
  return score;
}
async function fetchSeriesBooks(series, author = '', currentTitle = ''){
  const cleanSeries = String(series || '').trim();
  if (!cleanSeries) return [];
  const googleQuery = [`"${cleanSeries}"`, author ? `inauthor:${author}` : ''].filter(Boolean).join(' ');
  const openLibraryQuery = [cleanSeries, author].filter(Boolean).join(' ');
  const [olResult, googleResult] = await Promise.allSettled([
    olSearch(openLibraryQuery, 25),
    googleBooksQuery(googleQuery, 25)
  ]);

  const candidates = [];
  const olDocs = olResult.status === 'fulfilled' ? olResult.value : [];
  olDocs.forEach(doc => candidates.push(metadataFromDoc(doc)));
  const googleItems = googleResult.status === 'fulfilled' ? googleResult.value : [];
  googleItems.forEach(item => candidates.push(metadataFromGoogleVolume(item)));

  const currentTitleNorm = normalizeMetadataTitle(currentTitle);
  const seen = new Set();
  return candidates
    .map(book => ({ ...book, series: book.series || cleanSeries, score: seriesCandidateScore(book, cleanSeries, author) }))
    .filter(book => {
      if (!book.title || normalizeMetadataTitle(book.title) === currentTitleNorm) return false;
      if (!englishText(book.title) || (book.author && !englishText(book.author))) return false;
      if (book.score < 10 && normalizeMetadataTitle(book.series) !== normalizeMetadataTitle(cleanSeries)) return false;
      const key = seriesTitleKey(book);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a,b) => (a.year || 9999) - (b.year || 9999) || a.title.localeCompare(b.title))
    .slice(0, 30)
    .map(book => ({
      title: book.title,
      author: book.author || '',
      pages: book.pages || null,
      genre: book.genre || '',
      series: book.series || cleanSeries,
      year: book.year || null,
      status: 'want',
      startDate: '',
      finishDate: '',
      rating: null,
      isbn: book.isbn || '',
      coverUrl: book.coverUrl || '',
      notes: '',
      loan: null,
    }));
}
/* ==========================================================
   CRUD
   ========================================================== */
function booksAreDuplicates(a, b){
  const at = normalizeMetadataTitle(a?.title);
  const bt = normalizeMetadataTitle(b?.title);
  if (!at || !bt || at !== bt) return false;
  const aa = normalizeAuthor(a?.author);
  const ba = normalizeAuthor(b?.author);
  if (aa && ba) return aa === ba;
  return true;
}
function findDuplicateBook(book, ignoreId = null, list = state.books){
  return list.find(existing => existing.id !== ignoreId && booksAreDuplicates(existing, book));
}
function filterDuplicateBooks(books){
  const accepted = [];
  let skipped = 0;
  for (const book of books){
    if (findDuplicateBook(book, null, state.books) || findDuplicateBook(book, null, accepted)){
      skipped++;
      continue;
    }
    accepted.push(book);
  }
  return { accepted, skipped };
}
async function persistBooks(){
  return await storage.set(KEYS.books, state.books);
}
async function addBook(b){
  if (findDuplicateBook(b)){
    toast('Duplicate book ignored');
    return { added:0, skipped:1, save:null };
  }
  state.books.unshift({ id: uid(), addedAt: Date.now(), ...b });
  const save = await persistBooks();
  renderAll();
  return { added:1, skipped:0, save };
}
async function addBooks(books){
  const { accepted, skipped } = filterDuplicateBooks(books);
  if (!accepted.length){
    renderAll();
    return { added:0, skipped, save:null };
  }
  const now = Date.now();
  const prepared = accepted.map((b, i) => ({ id: uid(), addedAt: now + i, ...b }));
  state.books.unshift(...prepared);
  const save = await persistBooks();
  renderAll();
  return { added:prepared.length, skipped, save };
}
async function updateBook(id, patch){
  const i = state.books.findIndex(b => b.id === id);
  if (i < 0) return { updated:false, duplicate:false, save:null };
  if (findDuplicateBook(patch, id)){
    toast('Duplicate book ignored');
    return { updated:false, duplicate:true, save:null };
  }
  state.books[i] = { ...state.books[i], ...patch };
  const save = await persistBooks();
  renderAll();
  return { updated:true, duplicate:false, save };
}
async function deleteBook(id){
  state.books = state.books.filter(b => b.id !== id);
  const save = await persistBooks();
  renderAll();
  return { deleted:true, save };
}

/* ==========================================================
   FILTER + SORT
   ========================================================== */
function visibleBooks(viewName){
  let books = state.books.slice();
  if (viewName === 'library') books = books.filter(b => b.status === 'read' || b.status === 'reading');
  else if (viewName === 'want') books = books.filter(b => b.status === 'want');
  else if (viewName === 'loans') books = books.filter(b => b.loan);

  // search filter
  const q = state.search.trim().toLowerCase();
  if (q){
    books = books.filter(b => (
      (b.title||'').toLowerCase().includes(q) ||
      (b.author||'').toLowerCase().includes(q) ||
      (b.genre||'').toLowerCase().includes(q) ||
      (b.notes||'').toLowerCase().includes(q)
    ));
  }

  // sort
  const sort = state.sort;
  const cmp = {
    recent:    (a,b) => (b.addedAt||0) - (a.addedAt||0),
    title:     (a,b) => (a.title||'').localeCompare(b.title||''),
    author:    (a,b) => (a.author||'').localeCompare(b.author||''),
    finished:  (a,b) => new Date(b.finishDate||0) - new Date(a.finishDate||0),
    pages_desc:(a,b) => (parseInt(b.pages)||0) - (parseInt(a.pages)||0),
    pages_asc: (a,b) => (parseInt(a.pages)||0) - (parseInt(b.pages)||0),
    rating:    (a,b) => (parseInt(b.rating)||0) - (parseInt(a.rating)||0),
  }[sort];
  if (cmp) books.sort(cmp);
  return books;
}

function renderSidebar(){
  const lib = state.books.filter(b => b.status === 'read' || b.status === 'reading').length;
  const want = state.books.filter(b => b.status === 'want').length;
  const loans = state.books.filter(b => b.loan).length;
  $('#count-library').textContent = lib;
  $('#count-want').textContent = want;
  $('#count-loans').textContent = loans;

  const finished = state.books.filter(b => b.status === 'read');
  const totalPages = finished.reduce((a,b) => a + (parseInt(b.pages)||0), 0);
  const yr = new Date().getFullYear();
  const thisYear = finished.filter(b => b.finishDate && new Date(b.finishDate).getFullYear() === yr).length;

  $('#total-pages-num').textContent = totalPages.toLocaleString();
  $('#total-books').textContent = finished.length;
  $('#total-year').textContent = thisYear;

  // Progress: this year vs a friendly 24-book annual goal (or scale to actual if higher)
  const goal = Math.max(24, thisYear);
  const pct = Math.min(100, Math.round(thisYear / goal * 100));
  $('#progress-fill').style.width = pct + '%';
}

function bookCard(b){
  const cover = b.coverUrl
    ? `<img src="${esc(b.coverUrl)}" alt="" onerror="this.onerror=null;this.outerHTML='<div class=&quot;cover-fallback&quot;>${esc((b.title||'').slice(0,40))}</div>'">`
    : `<div class="cover-fallback">${esc((b.title||'').slice(0,40)) || '—'}</div>`;

  const statusKey = b.status || 'want';
  const statusLbl = statusKey === 'read' ? 'Finished' : statusKey === 'reading' ? 'Reading' : 'Want';

  const facts = [];
  if (b.pages) facts.push(`${b.pages} pp`);
  if (b.year) facts.push(b.year);
  if (b.isbn) facts.push(`ISBN ${b.isbn}`);

  const genreLine = [b.genre, b.series].filter(Boolean).map(esc).join(' · ');

  let dateLine = '';
  if (statusKey === 'read' && b.finishDate) dateLine = `Finished ${fmtDate(b.finishDate)}`;
  else if (statusKey === 'reading' && b.startDate) dateLine = `Started ${fmtDate(b.startDate)}`;

  const rating = parseInt(b.rating) || 0;
  let ratingHtml = '';
  if (rating > 0){
    ratingHtml = `<div class="rating">${'★'.repeat(rating)}<span class="empty">${'★'.repeat(5-rating)}</span></div>`;
  } else {
    ratingHtml = '<div></div>';
  }

  const metadataUpdating = b.id && state.metadataUpdatingIds.has(b.id);

  let loanHtml = '';
  if (b.loan){
    const dir = b.loan.type === 'lent_to' ? '→' : '←';
    loanHtml = `<div class="loan-pill">${dir} ${esc(b.loan.person||'?')}</div>`;
  }

  return `
    <article class="project-card" data-id="${b.id}">
      <div class="cover-frame">${cover}</div>
      <div class="card-content">
        <h3 class="card-title">${esc(b.title || 'Untitled')}</h3>
        <p class="card-author">${esc(b.author || 'Unknown')}</p>
        <div class="card-meta-row">
          ${facts.length ? `<div class="card-meta-line">${facts.map(esc).join(' · ')}</div>` : ''}
          ${genreLine ? `<div class="card-meta-line wrap">${genreLine}</div>` : ''}
          ${dateLine ? `<div class="card-meta-line">${esc(dateLine)}</div>` : ''}
        </div>
        <div class="card-bottom">
          <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
            <span class="status-pill ${statusKey}">${statusLbl}</span>
            ${loanHtml}
          </div>
          ${ratingHtml}
        </div>
      </div>
      ${metadataUpdating ? '<span class="metadata-pill">Updating metadata</span>' : ''}
    </article>
  `;
}

function emptyState(quote, sub){

function renderGrid(viewName, gridId, emptyQuote, emptySub){

/* ==========================================================
   INSIGHTS
   ========================================================== */
let charts = { genre:null, author:null, status:null };

function tally(books, key){
  const m = {};
  books.forEach(b => {
    const v = (b[key]||'').toString().trim();
    if (!v) return;
    m[v] = (m[v]||0) + 1;
  });
  return m;
}
function topN(m, n=6){
  const e = Object.entries(m).sort((a,b) => b[1]-a[1]);
  if (e.length <= n) return e;
  const top = e.slice(0,n);
  const rest = e.slice(n).reduce((a,x) => a + x[1], 0);
  if (rest) top.push(['Other', rest]);
  return top;
}

function getCSS(varName){
  return getComputedStyle(document.body).getPropertyValue(varName).trim();
}

function drawDonut(canvasId, legendId, entries){
  const canvas = document.getElementById(canvasId);
  const key = canvasId.replace('chart-','');
  if (charts[key]){ charts[key].destroy(); charts[key] = null; }
  if (!entries.length){
    canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    document.getElementById(legendId).innerHTML = '<div style="color:var(--muted-2);font-size:.85rem">No data yet.</div>';
    return;
  }
  const labels = entries.map(e => e[0]);
  const data = entries.map(e => e[1]);
  const colors = labels.map((_,i) => CHART_PALETTE[i % CHART_PALETTE.length]);
  const total = data.reduce((a,b) => a+b, 0);
  const borderColor = getCSS('--panel') || '#131316';

  charts[key] = new Chart(canvas, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderColor, borderWidth: 2 }] },
    options: {
      cutout: '60%',
      plugins: { legend: { display: false } },
      maintainAspectRatio: false,
    }
  });

  document.getElementById(legendId).innerHTML = entries.map((e,i) => `
    <div class="lg-row">
      <span class="lg-swatch" style="background:${colors[i]}"></span>
      <span class="lg-name">${esc(e[0])}</span>
      <span class="lg-val">${e[1]} · ${Math.round(e[1]/total*100)}%</span>
    </div>`).join('');
}

function renderInsights(){
  const finished = state.books.filter(b => b.status === 'read');
  drawDonut('chart-genre', 'legend-genre', topN(tally(finished, 'genre'), 6));
  drawDonut('chart-author', 'legend-author', topN(tally(finished, 'author'), 6));

  const statusMap = { Finished:0, Reading:0, 'Want to Read':0 };
  state.books.forEach(b => {
    if (b.status === 'read') statusMap.Finished++;
    else if (b.status === 'reading') statusMap.Reading++;
    else if (b.status === 'want') statusMap['Want to Read']++;
  });
  drawDonut('chart-status', 'legend-status', Object.entries(statusMap).filter(e => e[1] > 0));

  renderProfile(finished);
  renderRecommendations(finished);
  renderNumbers(finished);
  renderRecent();
}

function renderProfile(finished){
  const el = $('#profile-text');
  if (!finished.length){
    el.innerHTML = `Your reading profile will appear here after you log a few finished books.`;
    return;
  }
  const totalPages = finished.reduce((a,b) => a + (parseInt(b.pages)||0), 0);
  const avgPages = Math.round(totalPages / finished.length);
  const genres = topN(tally(finished, 'genre'), 1);
  const authors = topN(tally(finished, 'author'), 1);
  const topGenre = genres[0]?.[0] || null;
  const topAuthor = authors[0]?.[0] || null;
  const topAuthorCount = authors[0]?.[1] || 0;

  const durations = finished
    .filter(b => b.startDate && b.finishDate)
    .map(b => daysBetween(b.startDate, b.finishDate))
    .filter(Boolean);
  const avgDays = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : null;

  let html = `You have read <span class="num">${finished.length}</span> book${finished.length===1?'':'s'} totalling <span class="num">${totalPages.toLocaleString()}</span> pages.`;
  if (topGenre) html += ` Your shelves lean toward <strong>${esc(topGenre)}</strong>.`;
  if (topAuthor && topAuthorCount > 1) html += ` <strong>${esc(topAuthor)}</strong> has earned the most space — ${topAuthorCount} books.`;
  html += ` Your books average <span class="num">${avgPages}</span> pages.`;
  if (avgDays) html += ` You typically finish one in <span class="num">${avgDays}</span> day${avgDays===1?'':'s'}.`;
  el.innerHTML = html;
}

function renderRecommendations(finished){
  const el = $('#reco-list');
  if (finished.length < 2){
    el.innerHTML = `<div class="reco">Log a few more finished books and recommendations will surface from your patterns.</div>`;
    return;
  }
  const recos = [];

  const genres = topN(tally(finished, 'genre'), 3);
  if (genres.length){
    recos.push(`<div class="reco"><strong>You favor ${esc(genres.map(g=>g[0]).join(', '))}.</strong> Look for award lists or "best of" anthologies in these genres for your next pick.</div>`);
  }

  const authorsMap = tally(finished, 'author');
  const repeats = Object.entries(authorsMap).filter(e => e[1] >= 2);
  if (repeats.length){
    const top = repeats.sort((a,b) => b[1]-a[1])[0];
    recos.push(`<div class="reco"><strong>You return to ${esc(top[0])} (${top[1]} books).</strong> Their full bibliography is worth exploring — check for unread titles.</div>`);
  }

  const onceAuthors = Object.entries(authorsMap).filter(e => e[1] === 1).slice(0,3);
  if (onceAuthors.length){
    recos.push(`<div class="reco"><strong>One-and-done so far:</strong> ${esc(onceAuthors.map(a=>a[0]).join(', '))}. If any stuck with you, try a second book from them.</div>`);
  }

  const lengths = finished.map(b => parseInt(b.pages)||0).filter(n => n > 0);
  if (lengths.length){
    const avg = Math.round(lengths.reduce((a,b)=>a+b,0)/lengths.length);
    const range = avg < 250 ? 'shorter, focused' : avg < 400 ? 'mid-length' : 'longer, immersive';
    recos.push(`<div class="reco"><strong>Sweet spot: ~${avg} pages</strong> (${range} reads). Match this when picking your next book.</div>`);
  }

  const want = state.books.filter(b => b.status === 'want');
  if (want.length && genres.length){
    const match = want.find(b => b.genre && genres.some(g => g[0].toLowerCase() === b.genre.toLowerCase()));
    if (match){
      recos.push(`<div class="reco"><strong>From your wishlist:</strong> <em>${esc(match.title)}</em> matches your top genre — read it next.</div>`);
    }
  }

  el.innerHTML = recos.join('') || `<div class="reco">No recommendations yet. Add genres and authors to your books to surface patterns.</div>`;
}

function renderNumbers(finished){
  const totalPages = finished.reduce((a,b) => a + (parseInt(b.pages)||0), 0);
  const longest = finished.reduce((m,b) => {
    const p = parseInt(b.pages)||0;
    return p > (m?.p||0) ? { t:b.title, p } : m;
  }, null);
  const recent = [...finished].filter(b => b.finishDate).sort((a,b) => new Date(b.finishDate)-new Date(a.finishDate))[0];
  const durations = finished.filter(b => b.startDate && b.finishDate).map(b => daysBetween(b.startDate, b.finishDate));
  const fastest = durations.length ? Math.min(...durations) : null;
  const ratings = finished.map(b => parseInt(b.rating)||0).filter(n => n > 0);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '—';

  const rows = [
    ['Books finished', finished.length],
    ['Total pages', totalPages.toLocaleString()],
    ['Average rating', avgRating],
    ['Wishlist size', state.books.filter(b => b.status === 'want').length],
    ['Currently reading', state.books.filter(b => b.status === 'reading').length],
    ['On loan total', state.books.filter(b => b.loan).length],
    ['Longest read', longest ? `${longest.t} (${longest.p}p)` : '—'],
    ['Most recent finish', recent ? `${recent.title}` : '—'],
    ['Fastest read', fastest ? `${fastest} day${fastest===1?'':'s'}` : '—'],
  ];
  $('#stat-rows').innerHTML = rows.map(r =>
    `<div class="stat-row"><span class="key">${esc(r[0])}</span><span class="val">${esc(r[1])}</span></div>`
  ).join('');
}

function renderRecent(){
  const events = [];
  state.books.forEach(b => {
    if (b.finishDate) events.push({ date: b.finishDate, label: 'Finished', title: b.title });
    if (b.startDate)  events.push({ date: b.startDate, label: 'Started', title: b.title });
  });
  events.sort((a,b) => new Date(b.date) - new Date(a.date));
  const top = events.slice(0, 8);
  $('#recent-list').innerHTML = top.length
    ? top.map(e => `<div class="stat-row"><span class="key">${esc(e.label)} · ${esc(e.title)}</span><span class="val">${fmtDate(e.date)}</span></div>`).join('')
    : '<div class="stat-row"><span class="key">No activity logged yet.</span></div>';
}

function resizeProfileImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read image.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load image.'));
      img.onload = () => {
        const max = 320;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function toIsoFinishedDate(year, month, day){
  const y = Number(year);
  if (!y || y < 1000 || y > 9999) return '';
  if (!month || !day) return `${y}-12-31`;
  const m = Number(month);
  const d = Number(day);
  if (m < 1 || m > 12 || d < 1 || d > 31) return `${y}-12-31`;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function normalizePastedYear(yearText){
  const n = Number(yearText);
  if (!Number.isInteger(n) || n < 1000 || n > 9999) return null;
  return n;
}

function normalizePastedDateYear(dateYear, currentYear){
  if (!dateYear) return currentYear;
  const n = Number(dateYear);
  if (dateYear.length === 2) return n >= 70 ? 1900 + n : 2000 + n;
  return n;
}

function parseBulkFinishedBooks(text){
  const books = [];
  const errors = [];
  let currentYear = null;

  text.split(/\r?\n/).forEach((rawLine, idx) => {
    const line = rawLine.trim();
    if (!line) return;

    const yearMatch = line.match(/^(\d{4})\s*:?$/);
    if (yearMatch){
      currentYear = normalizePastedYear(yearMatch[1]);
      if (!currentYear) errors.push(`Line ${idx + 1}: invalid year.`);
      return;
    }

    if (!currentYear){
      errors.push(`Line ${idx + 1}: add a year header before this book.`);
      return;
    }

    const datedMatch = line.match(/^(.*?)\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))\s*$/);
    const title = (datedMatch ? datedMatch[1] : line).trim();
    if (!title){
      errors.push(`Line ${idx + 1}: missing book title.`);
      return;
    }

    const finishYear = datedMatch ? normalizePastedDateYear(datedMatch[4], currentYear) : currentYear;
    const finishDate = datedMatch
      ? toIsoFinishedDate(finishYear, datedMatch[2], datedMatch[3])
      : toIsoFinishedDate(currentYear);

    books.push({
      title,
      author: '',
      pages: null,
      genre: '',
      series: '',
      year: null,
      status: 'read',
      startDate: '',
      finishDate,
      rating: null,
      isbn: '',
      coverUrl: '',
      notes: '',
      loan: null,
    });
  });

  return { books, errors };
}

$('#bulk-books-input').addEventListener('input', e => {
  const preview = $('#bulk-preview');

function setCardMetadataUpdating(id, isUpdating){
  if (!id) return;

  else state.metadataUpdatingIds.delete(id);
  renderAll();
}

function setSeriesStatus(text){
  const el = $('#d-series-status');
  if (el) el.textContent = text || '';
}
function refreshSeriesAddAllUI(){
  const actions = $('#series-actions');
  if (!actions) return;
  const hasSeries = !!$('#d-series').value.trim();
  actions.hidden = !hasSeries;
  if (!hasSeries) setSeriesStatus('');
