function applyMetadataToDetail(metadata, overwrite = true){
  if (!metadata) return;
  if (!$('#d-author').value.trim() && metadata.author) $('#d-author').value = metadata.author;
  if (overwrite || !$('#d-pages').value) $('#d-pages').value = metadata.pages || $('#d-pages').value || '';
  if (overwrite || !$('#d-year').value) $('#d-year').value = metadata.year || $('#d-year').value || '';
  if (overwrite || !$('#d-genre').value) $('#d-genre').value = metadata.genre || $('#d-genre').value || '';
  if (overwrite || !$('#d-isbn').value) $('#d-isbn').value = metadata.isbn || $('#d-isbn').value || '';
  if (overwrite || !$('#d-series').value) $('#d-series').value = metadata.series || $('#d-series').value || '';
  if ((overwrite || !$('#d-cover-url').value) && metadata.coverUrl && !detailDialog._manualCoverChanged) setDetailCover(metadata.coverUrl);
  refreshSeriesAddAllUI();
}
let detailMetadataTimer = null;
let detailMetadataToken = 0;
async function refreshDetailMetadata({ debounce = false, silent = false } = {}){
  clearTimeout(detailMetadataTimer);
  const run = async () => {
    const title = $('#d-title').value.trim();
    const author = $('#d-author').value.trim();
    const isbn = $('#d-isbn').value.trim();
    if (!title && !isbn) return;
    const token = ++detailMetadataToken;
    const editingId = state.editingId;
    if (!silent) setDetailMetadataStatus('Updating metadata…');
    setCardMetadataUpdating(editingId, true);
    try {
      const metadata = isbn ? await fetchMetadataFromISBN(isbn) : await fetchBookMetadata(title, author);
      if (token !== detailMetadataToken) return;
      if (metadata){
        applyMetadataToDetail(metadata, true);
        if (!silent) setDetailMetadataStatus('Metadata updated');
      } else if (!silent){
        setDetailMetadataStatus('No matching English metadata found');
      }
      detailDialog._metadataQueryDirty = false;
    } catch {
      if (!silent) setDetailMetadataStatus('Metadata update failed');
    } finally {
      if (token === detailMetadataToken){
        setCardMetadataUpdating(editingId, false);
        if (!silent) setTimeout(() => setDetailMetadataStatus('', false), 1800);
      }
    }
  };
  if (debounce) detailMetadataTimer = setTimeout(run, 650);
  else await run();
}
async function findCoverOptions(){
  const title = $('#d-title').value.trim();
  const author = $('#d-author').value.trim();
  const isbn = $('#d-isbn').value.trim();
  if (!title && !isbn){ toast('Title or ISBN required'); return; }
  setDetailMetadataStatus('Finding covers…');
  try {
    const choices = await getCoverChoices(title, author, isbn);
    const box = $('#cover-results');
    if (!choices.length){
      box.style.display = 'none';
      box.innerHTML = '';
      setDetailMetadataStatus('No covers found');
      return;
    }
    box.innerHTML = choices.map((choice, i) => `
      <button class="cover-choice ${choice.coverUrl === $('#d-cover-url').value ? 'active' : ''}" data-cover="${esc(choice.coverUrl)}" title="${esc([choice.source, choice.title, choice.author, choice.year].filter(Boolean).join(' · '))}" type="button">
        <img src="${esc(choice.coverUrl)}" alt="Book cover option">
      </button>`).join('');
    box.style.display = '';
    box.querySelectorAll('.cover-choice').forEach(btn => {
      btn.addEventListener('click', () => {
        box.querySelectorAll('.cover-choice').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setDetailCover(btn.dataset.cover, true);
      });
    });
    setDetailMetadataStatus('Choose a cover below');
  } catch {
    setDetailMetadataStatus('Cover search failed');
  }
}

$('#d-save').addEventListener('click', async () => {
  const isNew = !state.editingId;
  showOperationStatus(isNew ? 'Adding book' : 'Saving book', detailDialog._metadataQueryDirty ? 'Updating metadata…' : 'Saving to database…', detailDialog._metadataQueryDirty ? 35 : 70, detailDialog._metadataQueryDirty ? 'Checking book sources' : 'Writing book record');
  try {
    if (detailDialog._metadataQueryDirty) await refreshDetailMetadata({ silent:true });
    const data = bookFromDetail();
    if (!data.title){ hideOperationStatus(); toast('Title required'); return; }
    updateOperationStatus('Saving to database…', 78, 'Writing book record');
    const result = state.editingId ? await updateBook(state.editingId, data) : await addBook(data);
    if (result?.duplicate){
      updateOperationStatus('Duplicate book ignored', 100, 'No duplicate saved');
      hideOperationStatus(900);
      return;
    }
    detailDialog.close();
    updateOperationStatus(databaseStatusText(result?.save), 100, 'Complete');
    toast(result?.skipped ? 'Duplicate book ignored' : 'Saved');
    hideOperationStatus(900);
  } catch (err){
    updateOperationStatus('Save failed', 100, err.message || 'Unknown error');
    toast('Save failed');
    hideOperationStatus(1600);
  }

/* ==========================================================
   EXPORT / IMPORT
   ========================================================== */
function download(filename, text, type){
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 0);
}

function exportJSON(){
  download('codex.json', JSON.stringify(state.books, null, 2), 'application/json');
  toast('Exported JSON');
}
function exportCSV(){
  const cols = ['title','author','pages','year','genre','series','status','startDate','finishDate','rating','isbn','notes','loanType','loanPerson','loanDate'];
  const escCSV = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const rows = [cols.join(',')];
  state.books.forEach(b => {
    rows.push(cols.map(c => {
      if (c === 'loanType') return escCSV(b.loan?.type || '');
      if (c === 'loanPerson') return escCSV(b.loan?.person || '');
      if (c === 'loanDate') return escCSV(b.loan?.date || '');
      return escCSV(b[c] ?? '');
    }).join(','));
  });
  download('codex.csv', rows.join('\n'), 'text/csv');
  toast('Exported CSV');
}

$('#export-json-side').addEventListener('click', exportJSON);
$('#export-csv-side').addEventListener('click', exportCSV);
$('#import-btn-side').addEventListener('click', () => $('#import-file').click());

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error('Expected an array');
    if (!confirm(`Import ${parsed.length} books? This will replace your current library.`)) return;
    state.books = parsed.map(b => ({ id: b.id || uid(), addedAt: b.addedAt || Date.now(), ...b }));
    await storage.set(KEYS.books, state.books);
    renderAll();
    toast(`Imported ${parsed.length} books`);
  } catch (err){
    toast('Import failed: ' + err.message);
  } finally {
    e.target.value = '';
  }
});

  // Load books
  state.books = (await storage.get(KEYS.books)) || [];
  renderAll();
})();
